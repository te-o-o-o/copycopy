[package]
name = "copycopy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A clipboard manager in Rust: everything you copy, one keystroke away."

[[bin]]
name = "copycopy"
path = "src/main.rs"

[dependencies]
copycopy-core = { path = "../core" }
copycopy-platform = { path = "../platform" }
# `image-without-codecs` rather than `image`: every picture reaching the history
# is normalised to PNG, and iced shares this crate's `image` 0.25, whose `png`
# feature below is all the decoding the preview needs. `image` would pull every
# codec in for nothing.
iced = { version = "0.14", features = ["advanced", "tokio", "canvas", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
global-hotkey = "0.8"
# `shellexecute-on-windows`: hands the link to ShellExecuteW directly. Without it
# Windows goes through `cmd /c start`, where a `&` inside a copied URL can chain
# a command.
open = { version = "5.4", features = ["shellexecute-on-windows"] }
interprocess = "2.4"
directories = "6"
auto-launch = "0.6.0"

[dev-dependencies]
# The `icon` example writes the `.ico` the Windows installer wants. The
# application itself only ever decodes PNG, so the encoder stays out of the
# released binary: with resolver 2, a dev-dependency is not resolved for a
# plain `cargo build`.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

# Everything below is read by `cargo deb`, which builds the Debian package in
# the release workflow. Paths are relative to this file.
[package.metadata.deb]
maintainer = "Théo Delmas <delmas.theo.dev@gmail.com>"
copyright = "2026 Théo Delmas"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
# `$auto` only finds what the binary links, which is libc and little else:
# winit and wgpu open X11, Wayland, xkbcommon and the GPU drivers with dlopen.
# Those have to be named by hand, or the package installs and the window never
# opens.
depends = "$auto, libxkbcommon0, libx11-6 | libwayland-client0, libvulkan1 | libgl1"
extended-description = "A clipboard manager: a resident captures every copy — text, code, images, files — and a global shortcut opens a searchable history. Nothing leaves the machine, and anything a password manager marks as secret is never stored."
assets = [
    ["target/release/copycopy", "usr/bin/", "755"],
    ["../../packaging/linux/copycopy.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/copycopy.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[target.'cfg(target_os = "windows")'.dependencies]
# The console: attaching to a parent terminal, or sending output to a log
# file. `Win32_UI_WindowsAndMessaging` is for `drag.rs`: `GetWindowRect`,
# to tell a drop back into our own window from a real one elsewhere.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Dragging a row out of the window. Linux is missing on purpose: the crate
# itself says winit cannot use it there yet, GTK only — see `drag.rs`.
drag = "2"
